name: Release

# Windows is built here. The Mac app is signed and notarized on a Mac with a Developer ID
# (see SIGNING.md) and added to the same release by hand, so GitHub never builds an unsigned
# Mac app that could replace it.
#
#   Push a tag (git tag v1.2.3 && git push origin v1.2.3): builds Windows and makes a DRAFT
#   release with RELEASE_NOTES.md as its text. Add the Mac files, then publish the draft.
#   Run it by hand from the Actions tab: builds Windows and keeps the installer as a download
#   on the run. No release is made.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: windows
          path: |
            dist/Downlink-Setup-x64.exe
            dist/Downlink-Setup-x64.exe.blockmap
            dist/latest.yml
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/Downlink-Setup-x64.exe
            dist/Downlink-Setup-x64.exe.blockmap
            dist/latest.yml
